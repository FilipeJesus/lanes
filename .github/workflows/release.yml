name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION}"

      - name: Check tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Has this version already been released?"
            exit 1
          fi

      - name: Swap README for marketplace
        run: |
          if [ -f "README.marketplace.md" ]; then
            cp README.md README.github.md
            cp README.marketplace.md README.md
          fi

      - name: Package extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx vsce package -o "lanes-${VERSION}.vsix"

      - name: Restore GitHub README
        run: |
          if [ -f "README.github.md" ]; then
            mv README.github.md README.md
          fi

      - name: Publish to VS Code Marketplace
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "lanes-${VERSION}.vsix"

      - name: Publish to Open VSX Registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "lanes-${VERSION}.vsix" -p "$OVSX_PAT"
        continue-on-error: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${GITHUB_SHA}"
          gh release create "v${VERSION}" "lanes-${VERSION}.vsix" --generate-notes --title "v${VERSION}"
